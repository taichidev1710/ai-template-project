name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci is stricter but flakes here: optional native-binding peers
      # (rollup/lightningcss) drift between platforms, desyncing the lockfile.
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # TẠM THỜI: GitHub Pages là static, không có proxy → build phải nhúng URL
          # backend đầy đủ. Đặt thẳng ở đây thay vì .env.production. Khi chuyển sang
          # nền tảng deploy có phần cấu hình env (Vercel/Netlify/Cloudflare...),
          # xoá dòng này và đặt VITE_API_BASE_URL trong settings của nền tảng đó.
          # Lưu ý: backend trên Render phải có CORS_ORIGINS chứa origin GitHub Pages.
          VITE_API_BASE_URL: 'https://be-template-vk71.onrender.com/api/v1'
          VITE_ENABLE_DEVTOOLS: 'false'
      # SPA fallback: GitHub Pages has no server-side routing, so unmatched
      # paths (deep links, refreshes) must still serve the app shell.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
